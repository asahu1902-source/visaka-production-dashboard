<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visaka Production Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    body { background-color: #000000; color: #ffffff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 12px 8px 30px 8px; }

    .app-viewport { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 14px; }
    
    .card { background: #07142b; border: 2px solid #38bdf8; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .card h2 { color: #ffff00; font-size: 18px; font-weight: 900; text-align: center; text-transform: uppercase; }
    .card h3 { color: #38bdf8; font-size: 15px; font-weight: 900; }

    /* TOP TARGET SUMMARY PANEL (Redesigned per exact specifications) */
    .target-panel { background: #0f172a; border: 2px solid #facc15; border-radius: 10px; overflow: hidden; }
    .top-req-box { background: #1e293b; color: #ffff00; font-size: 24px; font-weight: 900; text-align: center; padding: 10px; border-bottom: 2px solid #facc15; }
    .top-req-box span { display: block; font-size: 11px; color: #38bdf8; text-transform: uppercase; margin-top: 2px; }
    
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; text-align: center; border-bottom: 2px solid #facc15; }
    .grid-col { padding: 8px 4px; border-right: 1.5px solid #facc15; font-size: 10px; font-weight: bold; color: #38bdf8; background: #09203f; }
    .grid-col:last-child { border-right: none; }
    .grid-col span { display: block; font-size: 13px; font-weight: 900; color: #ffff00; margin-top: 3px; }
    
    .meta-row { display: flex; justify-content: space-around; background: #07142b; padding: 6px; font-size: 11px; font-weight: bold; border-bottom: 2px solid #facc15; color: #facc15; }
    .magenta-footer { background: #db2777; color: #ffffff; font-size: 13px; font-weight: 900; text-align: center; padding: 10px; text-transform: uppercase; }

    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label { color: #00ffff; font-size: 12px; font-weight: 800; }
    .form-input { width: 100%; background: #000000; color: #ffff00; border: 1.5px solid #38bdf8; padding: 10px; font-size: 14px; border-radius: 6px; outline: none; font-weight: bold; }

    .btn-submit { width: 100%; background: linear-gradient(90deg, #10b981, #059669); color: #ffffff; font-size: 15px; font-weight: 900; padding: 12px; border: none; border-radius: 8px; cursor: pointer; text-transform: uppercase; }
    .btn-cancel { background: #dc2626; margin-top: 6px; display: none; }
    .btn-settings { background: #0284c7; margin-bottom: 6px; }

    .standard-table { width: 100%; border-collapse: collapse; margin-top: 6px; }
    .standard-table th { background-color: #ff8c00; color: #000000; font-weight: 900; font-size: 9px; padding: 6px 2px; border: 1px solid #8b0000; text-align: center; }
    .standard-table td { border: 1px solid #8b0000; padding: 6px 2px; font-size: 9px; font-weight: bold; text-align: center; color: #ffffff; background: #000; }
    .cyan-cell { background-color: #00ffff !important; color: #000000 !important; font-weight: 900 !important; }
    
    .action-btn { padding: 3px 5px; font-size: 8px; font-weight: bold; border-radius: 4px; border: none; cursor: pointer; }
    .btn-edit { background: #0284c7; color: #fff; margin-right: 2px; }
    .btn-del { background: #dc2626; color: #fff; }
  </style>
</head>
<body>

  <div class="app-viewport">
    
    <!-- TOP TARGET SUMMARY PANEL -->
    <div class="target-panel">
      <div style="display: flex; justify-content: space-between; padding: 6px 10px; background: #0284c7; color: #000; font-weight: 900; font-size: 12px;">
        <span id="bannerShift">Shift: A</span>
        <span id="bannerDate">25-Jul-2026</span>
      </div>
      
      <div class="top-req-box">
        <span id="topReqSheetsVal">SETUP REQUIRED</span>
        <span>Total Required Sheets</span>
      </div>

      <div class="grid-3">
        <div class="grid-col">Produced Sheets<span id="bannerProduced">-</span></div>
        <div class="grid-col">Remaining Sheets<span id="bannerReqSheet">-</span></div>
        <div class="grid-col">Required / Hr<span id="bannerReqHr">-</span></div>
      </div>

      <div class="meta-row">
        <span>Target Size: <strong id="bannerTargetSize" style="color:#fff;">-</strong> m</span>
        <span>SFT: <strong id="bannerSft" style="color:#fff;">-</strong></span>
      </div>

      <div class="magenta-footer" id="bannerTimeLeft">REMAINING HOURS NOT SET</div>
    </div>

    <!-- MASTER SETTINGS PANEL -->
    <div class="card">
      <h3>⚙️ Master Settings</h3>
      <div style="display: flex; gap: 8px;">
        <div class="form-group" style="flex: 1;">
          <label>Target Production (MT)</label>
          <input type="number" id="setConfigTarget" class="form-input" placeholder="e.g. 130">
        </div>
        <div class="form-group" style="flex: 1;">
          <label>Target Size (m)</label>
          <input type="number" step="0.01" id="setConfigTargetSize" class="form-input" placeholder="e.g. 6">
        </div>
      </div>
      <div class="form-group">
        <label>Batch Weight (kg)</label>
        <input type="number" id="setConfigBatch" class="form-input" placeholder="e.g. 1250">
      </div>
      <button class="btn-submit btn-settings" onclick="saveSettingsData()">Save Settings 💾</button>
    </div>

    <!-- HOURLY ENTRY FORM -->
    <div class="card">
      <h3 id="formTitle">📝 Hourly Production Entry</h3>
      <input type="hidden" id="editRowIndex" value="">
      
      <div class="form-group">
        <label>Operator Name</label>
        <input type="text" id="opName" class="form-input" placeholder="Enter your name...">
      </div>

      <div style="display: flex; gap: 8px;">
        <div class="form-group" style="flex: 1;">
          <label>Shift</label>
          <select id="opShift" class="form-input" onchange="renderDashboard()">
            <option value="A">Shift A</option>
            <option value="B">Shift B</option>
            <option value="C">Shift C</option>
          </select>
        </div>
        <div class="form-group" style="flex: 1;">
          <label>Production Hour</label>
          <select id="opHour" class="form-input" onchange="renderDashboard()">
            <option value="1st Hour">1st Hour</option>
            <option value="2nd Hour">2nd Hour</option>
            <option value="3rd Hour">3rd Hour</option>
            <option value="4th Hour">4th Hour</option>
            <option value="5th Hour">5th Hour</option>
            <option value="6th Hour">6th Hour</option>
            <option value="7th Hour">7th Hour</option>
            <option value="8th Hour">8th Hour</option>
          </select>
        </div>
      </div>

      <div style="display: flex; gap: 8px;">
        <div class="form-group" style="flex: 1;">
          <label>1st Size (m)</label>
          <input type="text" id="opSize1" class="form-input" value="6">
        </div>
        <div class="form-group" style="flex: 1;">
          <label>2nd Size (m)</label>
          <input type="text" id="opSize2" class="form-input" value="6.00">
        </div>
      </div>

      <div style="display: flex; gap: 8px;">
        <div class="form-group" style="flex: 1;">
          <label>1st Size Sheets</label>
          <input type="number" id="opS1" class="form-input" placeholder="Blank if running 2nd">
        </div>
        <div class="form-group" style="flex: 1;">
          <label>2nd Size Sheets</label>
          <input type="number" id="opS2" class="form-input" placeholder="Blank if running 1st">
        </div>
      </div>

      <div style="display: flex; gap: 8px;">
        <div class="form-group" style="flex: 1;">
          <label>Moulding / ME Pickup</label>
          <input type="number" id="opMoulding" class="form-input" value="">
        </div>
        <div class="form-group" style="flex: 1;">
          <label>Beater (Common)</label>
          <input type="number" id="opBeater" class="form-input" value="">
        </div>
      </div>

      <div style="display: flex; gap: 8px;">
        <div class="form-group" style="flex: 1;">
          <label>B/D (min)</label>
          <input type="number" id="opBD" class="form-input" value="">
        </div>
        <div class="form-group" style="flex: 1;">
          <label>CSR (Rejection)</label>
          <input type="number" id="opGSR" class="form-input" value="">
        </div>
      </div>

      <button class="btn-submit" id="submitBtn" onclick="submitProductionEntry()">Submit Hourly Data ➔</button>
      <button class="btn-submit btn-cancel" id="cancelBtn" onclick="resetForm()">Cancel Edit</button>
    </div>

    <!-- PRODUCTION LOG TABLE -->
    <div class="card">
      <h3>📊 Production Log</h3>
      <div style="overflow-x: auto;">
        <table class="standard-table">
          <thead>
            <tr>
              <th>Hour</th>
              <th>Sz</th>
              <th>Sheets</th>
              <th>Beater</th>
              <th>BD</th>
              <th>Output MT</th>
              <th>Input MT</th>
              <th>ME%</th>
              <th>ROP</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="productionTableBody">
            <tr><td colspan="10" style="padding: 12px; color: #94a3b8;">Loading data...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxybGks2744Wmc3go7qwd7BJ_kEi_i577zQbaKyHX0Er3M7xssKxVmNpdep9ClMr3tHmw/exec";
    let globalData = [];
    let masterSettings = { targetProd: "", targetSize: "", batchWeight: "", sftConversion: 2.54 };

    function loadDashboardData() {
      const s = document.createElement('script');
      s.src = `${SCRIPT_URL}?action=getDashboardData&callback=handleDashboardResponse&t=${Date.now()}`;
      document.head.appendChild(s);
    }

    window.handleDashboardResponse = function(res) {
      if (!res || res.status !== "success") return;
      
      globalData = res.data.rows || [];
      masterSettings = res.data.masterSettings || masterSettings;
      
      if (masterSettings.targetProd !== "") document.getElementById('setConfigTarget').value = masterSettings.targetProd;
      if (masterSettings.targetSize !== "") document.getElementById('setConfigTargetSize').value = masterSettings.targetSize;
      if (masterSettings.batchWeight !== "") document.getElementById('setConfigBatch').value = masterSettings.batchWeight;

      renderDashboard();
    };

    function saveSettingsData() {
      const target = document.getElementById('setConfigTarget').value;
      const targetSize = document.getElementById('setConfigTargetSize').value;
      const batch = document.getElementById('setConfigBatch').value;

      const s = document.createElement('script');
      s.src = `${SCRIPT_URL}?action=saveSettings&targetProd=${target}&targetSize=${targetSize}&batchWeight=${batch}&callback=handleSettingsSaveResponse&t=${Date.now()}`;
      document.head.appendChild(s);
    }

    window.handleSettingsSaveResponse = function(res) {
      if (res && res.status === "success") {
        alert("Settings saved successfully!");
        loadDashboardData();
      } else {
        alert("Failed to save settings.");
      }
    };

    function renderDashboard() {
      const tbody = document.getElementById('productionTableBody');
      const selectedShift = document.getElementById('opShift').value;
      
      if (globalData.length === 0) {
        tbody.innerHTML = '<tr><td colspan="10" style="padding: 12px; color: #94a3b8;">No entries found yet.</td></tr>';
        updateBanner(0);
        return;
      }

      let totalProducedSheets = 0;
      let html = '';

      globalData.forEach(r => {
        let sheets = 0;
        let sizeUsed = 0;

        if (r.s2Sheets !== "" && r.s2Sheets !== null && !isNaN(r.s2Sheets)) {
          sheets = Number(r.s2Sheets);
          sizeUsed = Number(r.size2) || 0;
        } else if (r.s1Sheets !== "" && r.s1Sheets !== null && !isNaN(r.s1Sheets)) {
          sheets = Number(r.s1Sheets);
          sizeUsed = Number(r.size1) || 0;
        }

        if (r.shift === selectedShift && sheets > 0) {
          totalProducedSheets += sheets;
        }

        // Output MT = Sheets * Size * 12.8 / 1000
        let outputMTStr = "";
        let outputMTVal = 0;
        if (sheets > 0 && sizeUsed > 0 && !isNaN(sheets)) {
          outputMTVal = (sheets * sizeUsed * 12.8) / 1000;
          outputMTStr = outputMTVal.toFixed(2);
        }

        // Input MT = Beater * BatchWeight / 1000
        let inputMTStr = "";
        let inputMTVal = 0;
        if (masterSettings.batchWeight !== "" && r.beater !== "" && r.beater !== null && !isNaN(r.beater)) {
          inputMTVal = (Number(r.beater) * masterSettings.batchWeight) / 1000;
          inputMTStr = inputMTVal.toFixed(2);
        }

        // ME% = (1 - Output/Input) * 100 (Blank if input blank or zero)
        let mePctStr = "";
        if (sheets > 0 && inputMTVal > 0) {
          let meVal = (1 - (outputMTVal / inputMTVal)) * 100;
          mePctStr = meVal.toFixed(1) + "%";
        }

        // ROP = Output * 60 / (60 - Breakdown)
        let ropStr = "";
        if (sheets > 0 && outputMTVal > 0) {
          let bd = Number(r.bd) || 0;
          if (bd < 60) {
            let runMin = Math.max(1, 60 - bd);
            let ropVal = (outputMTVal * 60) / runMin;
            ropStr = ropVal.toFixed(2);
          }
        }

        const displaySheets = sheets > 0 ? sheets : "";

        html += `<tr>
          <td class="cyan-cell">${r.hour}</td>
          <td>${sizeUsed || ""}</td>
          <td style="color: #ffff00;">${displaySheets}</td>
          <td>${r.beater !== "" ? r.beater : ""}</td>
          <td>${r.bd !== "" ? r.bd : ""}</td>
          <td style="color: #facc15;">${outputMTStr}</td>
          <td>${inputMTStr}</td>
          <td style="color: #38bdf8;">${mePctStr}</td>
          <td>${ropStr}</td>
          <td>
            <button class="action-btn btn-edit" onclick="editRow(${r.rowIndex})">Edit</button>
            <button class="action-btn btn-del" onclick="deleteRow(${r.rowIndex})">Del</button>
          </td>
        </tr>`;
      });

      tbody.innerHTML = html;
      updateBanner(totalProducedSheets);
    }

    function updateBanner(totalProducedSheets) {
      const targetProd = masterSettings.targetProd;
      const targetSize = masterSettings.targetSize;
      
      if (targetProd === "" || targetSize === "" || isNaN(targetProd) || isNaN(targetSize) || targetSize <= 0) {
        document.getElementById('topReqSheetsVal').innerText = "SETUP REQUIRED";
        document.getElementById('bannerProduced').innerText = "-";
        document.getElementById('bannerReqSheet').innerText = "-";
        document.getElementById('bannerReqHr').innerText = "-";
        document.getElementById('bannerTargetSize').innerText = "-";
        document.getElementById('bannerSft').innerText = "-";
        document.getElementById('bannerTimeLeft').innerText = "REMAINING HOURS NOT SET";
        return;
      }

      // Required Sheets = Target MT * 1000 / (Target Size * 12.8)
      const totalReqSheets = (targetProd * 1000) / (targetSize * 12.8);
      document.getElementById('topReqSheetsVal').innerText = totalReqSheets.toFixed(2);
      document.getElementById('bannerProduced').innerText = totalProducedSheets.toFixed(2);

      // Remaining Sheets = Total Required Sheets - Produced Sheets (min 0)
      const reqSheets = Math.max(0, totalReqSheets - totalProducedSheets);
      document.getElementById('bannerReqSheet').innerText = reqSheets.toFixed(2);

      // Remaining Hours based on 8-hour shift and completed hour
      const currentHourStr = document.getElementById('opHour').value;
      const completedHours = parseInt(currentHourStr) || 1;
      const remainingHours = Math.max(0, 8 - completedHours);

      // Required/Hr = Remaining Sheets / Remaining Hours
      const reqPerHr = remainingHours > 0 ? (reqSheets / remainingHours) : 0;
      document.getElementById('bannerReqHr').innerText = reqPerHr.toFixed(2);

      // SFT calculation from Target Size
      const sftVal = targetSize * masterSettings.sftConversion;
      document.getElementById('bannerTargetSize').innerText = targetSize;
      document.getElementById('bannerSft').innerText = sftVal.toFixed(2);

      document.getElementById('bannerTimeLeft').innerText = `ONLY ${remainingHours} HOURS LEFT`;
    }

    function submitProductionEntry() {
      const name = document.getElementById('opName').value.trim();
      if (!name) {
        alert("Please enter operator name.");
        return;
      }

      const rowIndex = document.getElementById('editRowIndex').value;
      const shift = document.getElementById('opShift').value;
      const hour = document.getElementById('opHour').value;
      const size1 = document.getElementById('opSize1').value;
      const size2 = document.getElementById('opSize2').value;
      const s1Sheets = document.getElementById('opS1').value;
      const s2Sheets = document.getElementById('opS2').value;
      const moulding = document.getElementById('opMoulding').value;
      const beater = document.getElementById('opBeater').value;
      const bd = document.getElementById('opBD').value;
      const gsr = document.getElementById('opGSR').value;

      const btn = document.getElementById('submitBtn');
      btn.innerText = rowIndex ? "Updating..." : "Submitting...";
      btn.disabled = true;

      let url = `${SCRIPT_URL}?action=submitHourly&shift=${encodeURIComponent(shift)}&hour=${encodeURIComponent(hour)}&size1=${encodeURIComponent(size1)}&size2=${encodeURIComponent(size2)}&s1Sheets=${s1Sheets}&s2Sheets=${s2Sheets}&moulding=${moulding}&beater=${beater}&bd=${bd}&gsr=${gsr}&operator=${encodeURIComponent(name)}&callback=handleSubmitResponse&t=${Date.now()}`;
      
      if (rowIndex) {
        url += `&rowIndex=${rowIndex}`;
      }

      const s = document.createElement('script');
      s.src = url;
      document.head.appendChild(s);
    }

    window.handleSubmitResponse = function(res) {
      const btn = document.getElementById('submitBtn');
      btn.innerText = "Submit Hourly Data ➔";
      btn.disabled = false;
      resetForm();

      if (res && res.status === "success") {
        alert("Production data saved successfully!");
        loadDashboardData();
      } else {
        alert("Operation failed.");
      }
    };

    function editRow(idx) {
      const row = globalData.find(r => r.rowIndex === idx);
      if (!row) return;

      document.getElementById('editRowIndex').value = row.rowIndex;
      document.getElementById('opName').value = row.name;
      document.getElementById('opShift').value = row.shift;
      document.getElementById('opHour').value = row.hour;
      document.getElementById('opSize1').value = row.size1;
      document.getElementById('opSize2').value = row.size2;
      document.getElementById('opS1').value = row.s1Sheets;
      document.getElementById('opS2').value = row.s2Sheets;
      document.getElementById('opMoulding').value = row.moulding;
      document.getElementById('opBeater').value = row.beater;
      document.getElementById('opBD').value = row.bd;
      document.getElementById('opGSR').value = row.gsr;

      document.getElementById('formTitle').innerText = "✏️ Edit Hourly Entry (Row " + idx + ")";
      document.getElementById('submitBtn').innerText = "Update Entry ➔";
      document.getElementById('cancelBtn').style.display = "block";
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
      document.getElementById('editRowIndex').value = "";
      document.getElementById('formTitle').innerText = "📝 Hourly Production Entry";
      document.getElementById('submitBtn').innerText = "Submit Hourly Data ➔";
      document.getElementById('cancelBtn').style.display = "none";
      document.getElementById('opS1').value = "";
      document.getElementById('opS2').value = "";
      document.getElementById('opMoulding').value = "";
      document.getElementById('opBeater').value = "";
      document.getElementById('opBD').value = "";
      document.getElementById('opGSR').value = "";
    }

    function deleteRow(idx) {
      if (!confirm("Are you sure you want to delete this hourly entry?")) return;

      const s = document.createElement('script');
      s.src = `${SCRIPT_URL}?action=deleteHourly&rowIndex=${idx}&callback=handleDeleteResponse&t=${Date.now()}`;
      document.head.appendChild(s);
    }

    window.handleDeleteResponse = function(res) {
      if (res && res.status === "success") {
        alert("Entry deleted successfully!");
        loadDashboardData();
      } else {
        alert("Delete failed.");
      }
    };

    window.onload = function() {
      loadDashboardData();
    };
  </script>
</body>
</html>
